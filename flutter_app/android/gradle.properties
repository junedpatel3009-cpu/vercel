org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=192m -XX:+HeapDumpOnOutOfMemoryError

android.useAndroidX=true
android.defaults.buildfeatures.buildconfig=true

kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process

org.gradle.caching=false
# This machine has 7GB total RAM; keep the daemon's build serialized rather
# than spawning parallel workers that compete for memory (root cause of the
# "insufficient memory for the JRE" daemon crash after adding flutter_webrtc).
org.gradle.parallel=false
org.gradle.workers.max=2
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=true
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=true
kotlinVersion=2.2.20
kotlin_version=2.2.20
